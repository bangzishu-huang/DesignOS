            <template id= "hardware-1">
                <h1>Connection Executor 9600X (RobotDog)</h1>
                <i class="projectLiner">A 9-servo robot dog that can roam around autonomously, utilizing an ultrasonic sensor to avoid obstacles.</i>
                <div class="projectRow">
                    <img src="./Assets/Hardware1/final1.jpeg" class="projectPhotoH1">
                    <img src="./Assets/Hardware1/final2.jpeg" class="projectPhotoH1">
                </div>
                <div class="projectDesc">
                    <p>This was a project built for a 4 day hardware hackathon called "Stasis". It features a robotdog that uses 8 servo motors and inverse kinematics in order to replicate 4-legged movement. Another servo motor is attached to an ultrasonic sensor to act as the head for the robodog and detect incoming obstacles. A light switch (for the special ingredient) is present in the back of the robot to act as a quick on/off switch. There are 2 separate modes for the robot dog, one that you can manually control movement through the console, and another one where the robot dog will walk autonomously.</p>
                    <p>My team and I thought of making this robot dog because we wanted to challenge our own skills, while venturing into the "still-new" field of robotics for us. For a unique twist we attached a flag to the back of the robot dog that featured our socials, so it can roam around the venue and attract attention from fellow participants.</p>
                    <p>Majority of the time I worked on creating the 3D printed frames for our robot dog, as well as wiring all the components up while retaining wire management. I also took part in coding the inverse kinematics for both modes of the robot dog. I learned to apply continuous iterations to the custom designed robot dog frame and make tradeoffs between "ideal" building decisions compared to most realistic ones due to the time constraint given.</p>
                </div>
                <h3 style="margin-bottom: -8px;">Materials Used</h3>
                <ul>
                    <li>Servo Motors</li>
                    <li>ESP-32</li>
                    <li>Ultrasonic Sensor</li>
                    <li>Servo Driver (16 Channel)</li>
                    <li>5V Portable Battery</li>
                    <li>8 Ohms Circular Speaker</li>
                    <li>Audio Amplifier Board</li>
                    <li>Jumper Wires</li>
                    <li>Light Switch</li>
                </ul>
                <h3 style="margin-bottom: -5px;">Progress Photos</h3>
                <div class="projectRow">
                    <img src="./Assets/Hardware1/1.jpeg" class="projectProgress" style="object-position: center -380px;">
                    <img src="./Assets/Hardware1/2.jpeg" class="projectProgress" style="object-position: center -450px;">

                <div class="projectRow">
                    <img src="./Assets/Hardware1/3.jpeg" class="projectProgress" style="object-position: 0px -200px;">
                    <img src="./Assets/Hardware1/4.jpeg" class="projectProgress" style="object-position: center -160px;">

                    <img src="./Assets/github.svg" width="30" height="30">

            <template id= "hardware-2">
                <h1>RoboArm</h1>
                <i class="projectLiner">A 2 jointed robot arm that is able to be controlled wireless through a smartphone.</i>
                <div class="projectRow">
                    <img src="./Assets/Hardware2/final1.jpeg" class="projectPhotoRB" style="object-position: center -70px;">
                    <img src="./Assets/Hardware2/final2.jpeg" class="projectPhotoRB" style="object-position: center -60px;">
                </div>
                <div class="projectDesc">
                    <p>RoboArm is a robotic arm that has 2 movable joints, a base that is capable of horizontal movement, and a gripper that's able to open and close. The design for RoboArm, including the gears, are all custom made and 3D printed by me on AutoDesk Inventor. There are small cuts and indents in order to help with wiring space throughout the design.</p>
                    <p>This was one of the first robotics projects that I did completely on my own without the assistance of anyone else. It was pretty challenging trying to make gears from scratch and ensure all the tolerances would function as intended. It took a lot of trial-and-error especially since each 3D print would come out a little different. </p>
                    <p>Throughout this project I learned how to design specifically for manufacturing tolerance because it was completely different then the tolerance shown in the 3D model application. Additionally, I experienced what it felt to build alone, having only myself to rely on even during rough times when let's say the servo motor movement wasn't as intended. It taught me a lot about resilience and grit, just pushing through with the final goal in mind.</p>
                    <p></p>
                </div>
                <h3 style="margin-bottom: -8px;">Materials Used</h3>
                <ul>
                    <li>Servo Motors SG90</li>
                    <li>Ball Bearings</li>
                    <li>ESP-32</li>
                    <li>AA Batteries</li>
                    <li>4 AA Battery Holder</li>
                    <li>Jumper Wires</li>
                    <li>DC Barrel Jack to Screen Adapter</li>
                </ul>
                <h3 style="margin-bottom: -5px;">Progress Photos</h3>
                <div class="projectRow">

            <!-- Software Projects -->
            <template id= "software-1">
                <h1>DesignOS</h1>
                <i class="oneLiner">Custom-coded portfolio with the intent of functioning as a desktop OS right on any web browser.</i>
                <div class="projectRow">
                    <img src="./Assets/Software1/final1.png" class="projectPhotoS1">
                    <img src="./Assets/Software1/final2.png" class="projectPhotoS1"> 
                </div>
                <div class="projectDesc">
                    <p>I originally thought of the idea to build DesignOS because I realized how majority of the portfolio sites are all generated from generic website builders. In a world of talented designers, I wanted to make a portfolio that would leave a lasting impression on everyone who came across it. So, here I am building DesignOS, and trying to make this a reality. It essentially acts as an operating system functioning on any web browser with the "apps" displaying a variety of my projects and things about me.</p>
                    <p>In order for the entire interface to feel like an actual OS, I made sure to add Z-Indexing, which is basically organizing windows into specific layers (so the most recently clicked window is at the very top). Also, I implemented a bunch of mini animations when your cursor is hovered to give off a very minimalistic but sleek feel. There are a lot of subtle transition details I added that would make the entire OS experience feel more premium.</p>
                    <p>When I first started this project I was still pretty new to JavaScript and HTML, so through creating DesignOS I also became more efficient with the languages. It also taught me to think outside the box for a lot of problems, especially since I created this portfolio because I wanted to somehow differentiate myself. I truly enjoyed working on DesignOS, since I was able to express myself through this OS with all the elements and projects present.</p>
                </div>
                <h3 style="margin-bottom: -8px;">Tech Stack</h3>
                    <ul>
                        <li>Frontend: JavaScript, HTML, CSS</li>
                        <li>Hosting: GitHub Pages</li>
                        <li>Version Control: GitHub</li>
                        <li>Development Tools: Visual Studio Code, Live Server Extension</li>
                    </ul>
                <h3 style="margin-bottom: -5px;">Key Features</h3>

                <video autoplay loop muted playsinline preload="metadata" class="projectVideo">
                    <source src="./Assets/Software1/1.mp4" type="video/mp4">
                </video>

                <div class="featureCaption">
                    <strong>Draggable, layered windows</strong> 
                    <p>Each window of the OS can be dragged through the title bar and brought to the front upon clicking through a shared z-index counter. I wanted to make sure that the OS felt like an actual operating system, so I implemented this feature to make it feel more realistic rather than just a simple web page.</p>
                </div>

                <video autoplay loop muted playsinline preload="metadata" class="projectVideo">
                    <source src="./Assets/Software1/2.mp4" type="video/mp4">
                </video>

                <div class="featureCaption">
                    <strong>Subtle Animations</strong>
                    <p>Throughout the OS, I implemented various subtle animations to enhance the user experience. These include smooth transitions when opening and closing windows, as well as hover effects on interactive elements.</p>
                </div>

                <video autoplay loop muted playsinline preload="metadata" class="projectVideo">
                    <source src="./Assets/Software1/3.mp4" type="video/mp4">
                </video>

                <div class="featureCaption">
                    <strong>Dual Portfolio Composition</strong>
                    <p>DesignOS features a dual portfolio system, allowing users to explore my work in both the OS and traditional portfolio views. This allows the portfolio to accomodate users with different preferences and needs.</p>
                </div>

                <a href="https://github.com/bangzishu-huang/DesignOS" target="_blank" class="githubButton">

            <template id= "software-2">
                <h1>Where Stars Used to Sing</h1>
                <i class="oneLiner">A narrative-driven game exploring the quiet beauty of the world that we tend to forget as we grow older.</i>
                <div class="projectRow">
                    <!-- placeholders for now -->
                    <img src="./Assets/Software2/final1.png" class="projectPhotoS1">
                    <img src="./Assets/Software2/final2.png" class="projectPhotoS1">
                </div>
                <div class="projectDesc">
                    <p>The idea to create Where Stars Used to Sing came from when I was participating in GMTK 2026, the largest 4 day game jam on itch.io. The theme for the year was "Countdown", and after much brainstorming I wanted to interpret it in an unique sense so I created this narrative-driven game. The entire game essentially explores the concept of time and memory, showing that as we grow older, the world around us becomes more structured and less magical.</p>
                    <p>After the game jam ended, I found out that the game was rated top 4% for narrative and top 1% for popularity. I was thrilled with this accomplishment, considering I'm still relatively new to game development, so there's much more to learn. Throughout the game, I had to ensure that the narrative elements were well-integrated with the gameplay mechanics.</p>
                    <p>Since I built the game alone, I was able to learn a lot about game design and storytelling. At the end of the game jam, I did realize that there were still a couple of bugs and movement issues present, showing that I have much more to learn. This was an amazing experience for me and it allowed me to become a way better developer through learning new techniques and recognizing my strengths and weaknesses.</p>
                </div>
                <h3 style="margin-bottom: -8px;">Tech Stack</h3>
                    <ul>
                        <li>Game Engine: Custom 2D Engine (Vanilla JavaScript)</li>
                        <li>Frontend: JavaScript, HTML, CSS</li>
                        <li>Asset Creation: Sprite Fusion</li>
                        <li>Hosting: Itch.io</li>
                        <li>Version Control: GitHub</li>
                        <li>Development Tools: Visual Studio Code, Live Server Extension</li>
                    </ul>
                <h3 style="margin-bottom: -5px;">Key Moments</h3>
                <img src="./Assets/Software2/1.png" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Dialogue System</strong>
                    <p>The dialogue system was designed to create an immersive storytelling experinece, where random NPCs would be able to interact with the player in meaningful ways. This made the game feel much more alive and engaging for users.</p>
                </div>

                <img src="./Assets/Software2/2.png" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Pixel Blocking</strong>
                    <p>The pixel blocking feature was implemented to create a more authentic retro gaming experience, ensuring that sprites and backgrounds interacted properly. I had to ensure that stationary objects such as buildings or trees would not allow the player to walk or phase through them.</p>
                </div>

                <!-- Placeholder 3 -->
                <img src="./Assets/Software2/3.png" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Clue Finding</strong>
                    <p>Throughout the game, I scattered clues in each of the maps where the players would have to focus on the dialogue to uncover. This allowed for a more versatile and engaging gameplay experience, where players can uncover secrets through their careful observations.</p>
                </div>

                <!-- Placeholder 4 -->
                <img src="./Assets/Software2/4.png" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Multiple Endings</strong>
                    <p>Towards the end of the game, players are given the choice to alter the outcome of the entire story based off of their own decision. The choices present reflect the entire journey that the players went through, and it leaves the ultimate fate of the story in the hands of the player. Both endings are designed to leave a lasting impact and allow the player to think about how the game relates to their own lives.</p>
                </div>
