            <template id= "concept-1">
                <h1>ResQ Capsule</h1>
                <i class="oneLiner">Compact emergency rescue device for vehicles designed in for life-saving preparedness.</i>
                <div class="projectRow">
                    <img src="./Assets/Concept1/final1.jpg" class="projectPhotoS1">
                    <img src="./Assets/Concept1/final2.jpg" class="projectPhotoS1">
                </div>
                <div class="projectDesc">
                    <p>ResQ Capsule is a compact, all-in-one emergency escape tool designed to save lives while integrating seamlessly into people's daily driving routine. With its sleek capsule shape, it fits neatly into cup holders, door pockets, or even center consoles. It's designed in a way to always be accessible, and never intrusive.</p>
                    <p>I originally got the inspiration to make this product after seeing the window breakers that were being marketed online. I wanted to kind of attempt to make a design that would have more capabilities to ensure someone's safety in case of a car accident in the water. ResQ Capsule is designed with a deployable life bouy so that after you break into the water, the care still doesn't stop.</p>
                    <p>This was one of the times where I had to design for the inner mechanism in a sense. I did research on a lot of the parts I was going to include and had to make sure that the size of ResQ Capsule could fit it all while still maintaining compact. It took multiple iterations in order to make everything fit and retaining an aesthetically pleasing concept.</p>
                </div>
                <h3 style="margin-bottom: -8px;">Selected Honors</h3>
                <ul>
                    <li><a href="https://www.designmasterprize.com/winners/winner.php?id=22-3463-25&count=0&mode=zoom" target="_blank" style="color:black; font-weight: bolder;">Winner in Safety Design</a>  | Design MasterPrize</li>
                    <li><a href="https://www.productdesignaward.eu/winners/epda/2025/12639/" target="_blank" style="color: black; font-weight: bolder;">Winner in Industrial Product Design</a> | European Product Design Awards</li>
                </ul>
                <h3 style="margin-bottom: -8px">Software Used</h3>
                <ul>
                    <li>AutoDesk Inventor</li>
                    <li>Adobe Photoshop</li>
                    <li>Canva</li>
                </ul>
                <h3 style="margin-bottom: -5px">Product Views</h3>
                <img src="./Assets/Concept1/1.jpg" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Lighting Render</strong>
                    <p>This depicts ResQ Capsule floating midair, with a shadow cutting across it, creating an visually appealing and aesthetic look to the product render. This was also my favorite render of ResQ Capsule that I did throughout; this was one of the first times I focused on lighting and shadows in a product render.</p>
                </div>
                <img src="./Assets/Concept1/2.jpg" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Expanded Description</strong>
                    <p>An expanded view of ResQ Capsule that goes into detail on the purpose of each section, material used, engineering method (if applicable), and also any features. The lines were used in order to help users pinpoint the specific sections being descibed.</p>
                </div>
                <img src="./Assets/Concept1/3.jpg" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Car Render</strong>
                    <p>ResQ Capsule can be seen getting put into one of the car door pocket. This render helps highlight one of the locations where ResQ Capsule should be stored for the easiest access, and it also provides as a visual to help users gauge the size of the product.</p>
                </div>
                <img src="./Assets/Concept1/4.jpg" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Multiple Colors</strong>
                    <p>The render shows three different ResQ Capsules floating in the air, each with an unique color set including: white, grey, and black. The purpose of this render was made in order to introduce new colorsets that can be applied onto ResQ Capsule, showing that it can be accustomed to the user's personal preference.</p>
                </div>
            </template>

            <template id= "concept-2">
                <h1>FlexiBowl</h1>
                <i class="projectLiner">3-in-1 tableware set with detachable handle and utensils, designed for convenience.</i>
                <div class="projectRow">
                    <img src="./Assets/Concept2/final1.jpg" class="projectPhotoC2">
                    <img src="./Assets/Concept2/final2.jpg" class="projectPhotoC2">
                </div>
                <div class="projectDesc">
                    <p>FlexiBowl is a conceptual modular dining product designed to adapt to diverse lifestyles. Functioning as a bowl, plate, or cup, FlexiBowl allows people to enjoy meals in various ways, whether you are on the road for a camping trip or at home by yourself.</p>
                    <p>The inspiration to create this came from one of my camping trips I was on with my family. I had to pack all the utensils and tableware by itself so a large amount of my bag space was taken up and not to mention it added a lot of heavy weight. However, throughout the trip I noticed how all the tableware did look similar in a case and I thought to try and combine them together to make something unique but at the same time convenient for everyone.</p>
                    <p>I really enjoyed the initial brainstorming phase of FlexiBowl and this was one of the times that I started to discover the limitless possibilities that come with. I learned a lot about iteration as welll, because making the mechanism to transform the bowl was really difficult for me and I was only able to accomplish it through many failed designs.</p>
                </div>
                <h3 style="margin-bottom: -8px;">Selected Honors</h3>
                <ul>
                    <li><a href="https://www.worldfrontdesign.com/winners-1/flexibowl" target="_blank" style="color: black; font-weight: bolder;">Gold and Best Sustainable Healthcare Innovation</a> | World Front Design Award</li>
                    <li><a href="https://nydesignawards.com/winner.php" target="_blank" style="color: black; font-weight: bolder;">Home Interior - Tableware</a> | NY Product Design Award</li>
                </ul>
                <h3 style="margin-bottom: -8px;">Software Used</h3>
                <ul>
                    <li>AutoDesk Inventor</li>
                    <li>Canva</li>
                </ul>
                <h3 style="margin-bottom: -5px;">Product Views</h3>

                    <p>A render with all the different folding possibilties of FlexiBowl in the air, as well as the hidden utensil compartment underneath. This render was designed for users to have an aesthetic but simple look at all of FlexiBowl's functions and capabilities.</p>
                </div>

                    <strong>Color Options</strong>
                    <p>This displays a couple of different color options that are pushed out with FlexiBowl. All the color tones are designed to be light in order to be soothing to the eye and blend in naturally to the surroundings. It also features the simple, stackable packaging that FlexiBowl will come in.</p>
                </div>

                    <strong>Packaging Design</strong>

            <template id= "concept-3">
                <h1>Arborspira</h1>
                <i class="oneLiner">An autonomous solar-powered drones designed to disperse biodegradable seeds and pollen.</i>
                <div class="projectRow">
                    <img src="./Assets/Concept3/final1.png" class="projectPhotoS1">
                    <img src="./Assets/Concept3/final2.jpg" class="projectPhotoS1">
                </div>
                <div class="projectDesc">
                    <p>Arborspira is a drone that is built to be autnomous with extended flight time due to the aid of solar power. It disperses biodegradable (samara-inspired) seeds and pollen, with an electrostatic mechanism for pollen dispersion. It's designed to help rebuild forests, while promoting pollinator rebound.</p>
                    <p>In 2025, when the California wildfire struck and news stations all aroudn the world were reporting it, me and my team slowly started to realize the dangers of deforestation. Upon more research, we found that as deforestation increases, pollinator populations all throughout North America was rapidly declining to dangerous rates. This was the starting point of use making and designing Arborspira, in hopes of one day being launched to help the world recover it's greenery faster.</p>
                    <p>Since this was a team effort, we had to figure out how to distribute all the work throughout team members. I was the lead designer for Arborspira, so I designed all the renders, mockups, and the iterations of the drone model, while my teammates worked on finance and engineering. This project made me realize the importance of teamwork and how it made everything less stressful.</p>
                </div>
                <h3 style="margin-bottom: -8px;">Selected Honors</h3>
                <ul>
                    <li><a href="https://conrad.spacecenter.org/what-is-a-conrad-innovator/" target="_blank" style="color: black;; font-weight: bolder;">Conrad Innovator</a> | Conrad Challenge</li>
                    <li>Finalist | launchU Startup Challenge</li>
                </ul>
                <h3 style="margin-bottom: -8px;">Software Used</h3>
                <ul>
                    <li>Rhino 8</li>
                    <li>AutoDesk Inventor</li>
                    <li>Canva</li>
                </ul>
                <h3 style="margin-bottom: -5px;">Product Views</h3>
                <img src="./Assets/Concept3/1.png" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Dispersion Demo</strong>
                    <p>This shows Arborspira dropping our samara-inspired seed pods through the air. This render was intended to allow people to see a visual demonstration of how the drone would operate.</p>
                </div>
                <img src="./Assets/Concept3/2.png" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Back Snapshot</strong>
                    <p>The back of Arborspira is shown with the doors of where the pollen will be stored opened. It gives a quick visual for how the pollen mechanism and doors would operate when the drone is in the air for missions.</p>
                </div>
                <img src="./Assets/Concept3/3.png" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Size Reference</strong>
                    <p>A human silhouette is positioned right next to Arborspira in order to allow people to be able to reference the size of the drone compared to themselves. This allows people to have a visual grasp on the demensions of Arborspira.</p>
                </div>
                <img src="./Assets/Concept3/4.mp4" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>360 Turnaround</strong>
                    <p>This is just a 360 view of Arborspira, so you can see all the orientations of the drone in a top manner. This was implemented in order to allow everyone to get a full picture of how Arborspira looks and the parts that are integrated within it.</p>
                </div>
            </template>

            <template id= "concept-4">
                <h1>Fluid-S</h1>
                <i class="oneLiner">A chair crafted from upcycled oak and beech that was originally inspired by the human spine and sustainability.</i>
                <div class="projectRow">
                    <img src="./Assets/Concept4/final1.jpg" class="projectPhotoS1">
                    <img src="./Assets/Concept4/final2.jpg" class="projectPhotoS1">
                </div>
                <div class="projectDesc">
                    <p>The S-shape of Fluid-S is symbolic of the curvature of a human spine, along with representing the "S" in sustainability. By being made out of upcycled oak and beech every single one of these chairs are supposed to highlight environmental concious design, while still functioning as a daily chair for everyone.</p>
                    <p>I originally was inspired to make a chair with curvatures similar to the human spine but the more I looked at it the more I saw how the letter "S" would emerge. So then, I decided to give the chair a double meaning, and one of the most uprising issues in today's world was eco-friendly design, so I thought why not integrate it with that. After further research, I found out that a lot of furniture started to use upcycled wood in order to limit the amount of new trees that are being cut down.</p>
                    <p>This was the first design that had such a complex shape to it, so I spent a lot of time trying to figure out how to make the "S" design without having intersecting objects. It was also pretty difficult for me as Fluid-S was one of my very first project on Rhino when I just started fimiliar into it, but it taught me a lot about lighting and placement of the object during renders.</p>
                </div>
                <h3 style="margin-bottom: -8px;">Selected Honors</h3>
                <ul>
                    <li><a href="https://www.undesignawards.com/winners/view/id/1931.html" target="_blank" style="color: black; font-weight: bolder;">Silver in furnishings</a> | un Design Award</li>
                    <li><a href="https://www.wonderglobalawards.com/winners/69a1a8fb5b9c9b8d6a100c0c" target="_blank" style="color: black; font-weight: bolder;">Bronze in Home</a> | Wonder Global Design Awards</li>
                </ul>
                <h3 style="margin-top: -8px;">Software Used</h3>
                <ul>
                    <li>Rhino 8</li>
                    <li>Adobe Photoshop</li>
                </ul>
                <h3 style="margin-bottom: -5px;">Product Views</h3>
                <img src="./Assets/Concept4/1.jpg" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Sunset Room</strong>
                    <p>There are 2 chairs placed back to back inside a room that is pretty simple with wooden flooring. The sunset effect is casted upon the chairs in order to enhance the effects of the wood carvings done to Fluid-S. The sunset color tone was chosen in order to give a soothing visual to the scene.</p>
                </div>
                <img src="./Assets/Concept4/2.jpg" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Chair Render</strong>
                    <p>A simple and clean render of Fluid-S with some different shaped walls in the background. This was done in order to showcase the curvature of the chair especially the "S" shape that is made.</p>
                </div>
                <img src="./Assets/Concept4/3.jpg" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Different Tones</strong>
                    <p>3 different types of color tone chairs are displayed on a glossy reflective surface. It gives off a very modern look as well as highlighting the potiential colors that may be available for Fluid-S. The render also plays a lot with lighting and reflections since it's more of a shiny surface, a lot of light will bounce off and give different effects.</p>
                </div>
            </template>


            <!-- Hardware Projects -->
            <template id= "hardware-1">
                <h1>Connection Executor 9600X (RobotDog)</h1>
                <i class="projectLiner">A 9-servo robot dog that can roam around autonomously, utilizing an ultrasonic sensor to avoid obstacles.</i>
                <div class="projectRow">
                    <img src="./Assets/Hardware1/final1.jpeg" class="projectPhotoH1">
                    <img src="./Assets/Hardware1/final2.jpeg" class="projectPhotoH1">
                </div>
                <div class="projectDesc">
                    <p>This was a project built for a 4 day hardware hackathon called "Stasis". It features a robotdog that uses 8 servo motors and inverse kinematics in order to replicate 4-legged movement. Another servo motor is attached to an ultrasonic sensor to act as the head for the robodog and detect incoming obstacles. A light switch (for the special ingredient) is present in the back of the robot to act as a quick on/off switch. There are 2 separate modes for the robot dog, one that you can manually control movement through the console, and another one where the robot dog will walk autonomously.</p>
                    <p>My team and I thought of making this robot dog because we wanted to challenge our own skills, while venturing into the "still-new" field of robotics for us. For a unique twist we attached a flag to the back of the robot dog that featured our socials, so it can roam around the venue and attract attention from fellow participants.</p>
                    <p>Majority of the time I worked on creating the 3D printed frames for our robot dog, as well as wiring all the components up while retaining wire management. I also took part in coding the inverse kinematics for both modes of the robot dog. I learned to apply continuous iterations to the custom designed robot dog frame and make tradeoffs between "ideal" building decisions compared to most realistic ones due to the time constraint given.</p>
                </div>
                <h3 style="margin-bottom: -8px;">Materials Used</h3>
                <ul>
                    <li>Servo Motors</li>
                    <li>ESP-32</li>
                    <li>Ultrasonic Sensor</li>
                    <li>Servo Driver (16 Channel)</li>
                    <li>5V Portable Battery</li>
                    <li>8 Ohms Circular Speaker</li>
                    <li>Audio Amplifier Board</li>
                    <li>Jumper Wires</li>
                    <li>Light Switch</li>
                </ul>
                <h3 style="margin-bottom: -5px;">Design Process</h3>
                <img src="./Assets/Hardware1/1.jpeg" class="projectImgFeature" style="object-position: center -650px;">
                <div class="featureCaption">
                    <strong>Diagnostic Testing</strong>
                    <p>Before we started building the robot dog, we conducted diagnostic testing to ensure all components were functioning correctly. We also used this time to start coding and pushing our firmware to the servo motors (that had legs already attached so we could work on inverse kinematics).</p>
                </div>
                <img src="./Assets/Hardware1/2.jpeg" class="projectImgFeature" style="object-position: center -780px;">
                <div class="featureCaption">
                    <strong>Initial Assembly</strong>
                    <p>Once all components were tested, we began the assembly process. This involved carefully connecting each part and ensuring everything was aligned properly. We were optimizing more to get the basic functions working instead of trying to have an extensive approach on wire and build management.</p>
                </div>
                <img src="./Assets/Hardware1/3.jpeg" class="projectImgFeature" style="object-position: 0px -380px;">
                <div class="featureCaption">
                    <strong>Frame Reassembly</strong>
                    <p>After a couple of test runs, we had to reassemble certain parts to improve performance and address any issues that arose. Especially with the servo motors and ensuring that they were melted into the 3D printed legs in order to maximize grip. We also began to test the ultrasonic sensor for obstacle detection.</p>
                </div>
                <div class="projectVidWrap">
                    <video src="./Assets/Hardware1/demovid.mp4" class="projectVidFeature" controls></video>
                </div>
                <div class="featureCaption">
                    <strong>Final Product</strong>
                    <p>After more extensive testing and the implementation of the ultrasonic sensor addition, we were finally able to get the robot dog to freely move around. We attached a 5V portable battery at the bottom of the frame in order for it to roam autonmously.</p>
                </div>
                <a href="https://github.com/bangzishu-huang/Connection-Executor-9600X" target="_blank" class="githubButton">
                    <img src="./Assets/github.svg" width="30" height="30">
                    <span>View More Details in GitHub</span>
                </a>
            </template>


            <template id= "hardware-2">
                <h1>RoboArm</h1>
                <i class="projectLiner">A 2 jointed robot arm that is able to be controlled wireless through a smartphone.</i>
                <div class="projectRow">
                    <img src="./Assets/Hardware2/final1.jpeg" class="projectPhotoRB" style="object-position: center -70px;">
                    <img src="./Assets/Hardware2/final2.jpeg" class="projectPhotoRB" style="object-position: center -60px;">
                </div>
                <div class="projectDesc">
                    <p>RoboArm is a robotic arm that has 2 movable joints, a base that is capable of horizontal movement, and a gripper that's able to open and close. The design for RoboArm, including the gears, are all custom made and 3D printed by me on AutoDesk Inventor. There are small cuts and indents in order to help with wiring space throughout the design.</p>
                    <p>This was one of the first robotics projects that I did completely on my own without the assistance of anyone else. It was pretty challenging trying to make gears from scratch and ensure all the tolerances would function as intended. It took a lot of trial-and-error especially since each 3D print would come out a little different. </p>
                    <p>Throughout this project I learned how to design specifically for manufacturing tolerance because it was completely different then the tolerance shown in the 3D model application. Additionally, I experienced what it felt to build alone, having only myself to rely on even during rough times when let's say the servo motor movement wasn't as intended. It taught me a lot about resilience and grit, just pushing through with the final goal in mind.</p>
                    <p></p>
                </div>
                <h3 style="margin-bottom: -8px;">Materials Used</h3>
                <ul>
                    <li>Servo Motors SG90</li>
                    <li>Ball Bearings</li>
                    <li>ESP-32</li>
                    <li>AA Batteries</li>
                    <li>4 AA Battery Holder</li>
                    <li>Jumper Wires</li>
                    <li>DC Barrel Jack to Screen Adapter</li>
                </ul>
                <h3 style="margin-bottom: -5px;">Progress Photos</h3>
                <img src="./Assets/Hardware2/1.jpeg" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Gear System</strong>
                    <p>Before starting on the overall design of the robot arm, I decided to make an unique set of rotational gears that would be implemented all throughout the joints. Through this system, whenever the servo motor is moving the robot arm wouldn't have a very violent motion, instead it would maintain a slow and steady pace.</p>
                </div>
                <img src="./Assets/Hardware2/2.jpeg" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Joint Assembly</strong>
                    <p>After finishing the design for the holders of the servo motor for the joints of the robot arm, I moved everything into an assembly file in order to see how everything attaches. This was just a rough measurement for the entire arm, so I knew how to scale the base and got the first looks of a completed project.</p>
                </div>
                <img src="./Assets/Hardware2/3.jpeg" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Final Debugging</strong>
                    <p>After pretty much finishing the design for the entire robotic arm, I had to check for all the interferences that would occur and debug them as they would prevent the arm from functioning properly. At this point, I was just going back and forth editing the parts to ensure there were no interference present.</p>
                </div>
                <img src="./Assets/Hardware2/4.jpeg" class="projectImgFeature">
                <div class="featureCaption">
                    <strong>Initial Testing</strong>
                    <p>After 3D printing out all the seperate parts I had to connect them one by one in order to ensure there weren't any misalignment during the printing process. If there were any mistakes either I would reprint the same file or tweak the part and reprint it again. I also started testing all the electronic components in order to ensure it worked well with the firmware.</p>
                </div>
                <a href="https://github.com/bangzishu-huang/Roboarm" target="_blank" class="githubButton">
                    <img src="./Assets/github.svg" width="30" height="30">
                    <span>View More Details in GitHub</span>
                </a>
            </template>

            <template id="prototype-1">
                <h1>Squirrel Plex</h1>
                <i class="oneLiner">A squirrel house designed to maximize comfortable living space while shielding squirrels from harsh environments.</i>
                <div class="projectRow">
                    <img src="./Assets/Prototype1/final1.jpeg" class="projectPhotoRB">
                    <img src="./Assets/Prototype1/final2.jpeg" class="projectPhotoRB" style="object-position: center -70px;">
                </div>
                <div class="projectDesc">
                    <p>Squirrel Plex is basically a squirrel house that was inspired by modern apartment buildings, hence the two story build. The overall goal of it is to give squirrels access to essentially shelter whether it's during bad weather or for normal sleeping. It's made specifically for squirrels so they are able to utilize it however they want without the intervention of any devices, through a buckel strap mechanism that holds Squirrel Plex onto a tree trunch securely.</p>
                    <p>My initial idea was to make a simple birdhouse but after seeing the vast amounts of birdhouses around the neighborhood, I started to brainstorm what other animals would be able to stay in a shelter. Then, that's when it hit me and I decided to make some sort of house designed just for squirrels because you rarely see that type of house anywhere, so I thought out to try to design one.</p>
                    <p>This project it taught me a lot about physical product design, as I started out with an idea and tried to implement it into cardboard. It was very hands-on, which I really loved, but it took a large amount of time to build the concept and ensuring for example the demensions of the wall were cut correctly.</p>
                </div>
                <h3 style="margin-bottom: -8px;">Materials Used</h3>
                <ul>
                    <li>Cardboard</li>
                    <li>Foamcore</li>
                    <li>Gatorboard</li>
                    <li>Foam</li>
                    <li>Buckle Strap</li>
                </ul>
                <h3 style="margin-bottom: -5px;">Project Views</h3>
                <div class="carousel" id="conceptCarousel">
                    <div class="carouselTrack">
                        <img src="./Assets/Prototype1/1.1.png" class="carouselSlide active">
                        <img src="./Assets/Prototype1/1.2.png" class="carouselSlide">
                        <img src="./Assets/Prototype1/1.3.png" class="carouselSlide">
                    </div>
                    <button class="carouselBtn prev" aria-label="Previous Slide">&#10094;</button>
                    <button class="carouselBtn next" aria-label="Next Slide">&#10095;</button>
                </div> 
                <div class="featureCaption"> 
                    <strong>Inital Ideas</strong>
                    <p>These 3 cardboard designs where my initial ideas for what I wanted my squirrel house to look like. They were essentially quick ideas that I built pretty fast in order to get a sense of how everything would look. The ideas being made into a physical setting really helped me visualize the flaws and highlights of each design, which really helped me to narrow down my best piece.</p>
                </div>
                <img src="./Assets/Prototype1/2.jpeg" class="projectImgFeature" style="object-position: center -20px;">
                <div class="featureCaption">
                    <strong>Final Design</strong>
                    <p>So after deciding which one of the 3 cardboard inital design I wanted to go with, I used a mix of sturdy materials, like gatorboard and foamcore, in order to buid out the design. I used those specific materials since they promoted sturdy surfaces that were still versatile when slightly cut to form curves.</p>

                <div class="featureCaption">

                    <p>After finishing the build for the final design, I decided to test it out by actually attaching it onto a tree trunk in a local park. Suprisingly, it was very sturdy and Squirrel Plex stayed up right like it's supposed to be, so I was very happy with the outcome.</p>

                    <p>For the individual cardboard panels of the light I made them through Adobe Illustrator and had them cut out through a Zund Cutter. It was my first time really doing an assembly design where the panels would be made by a machine so it was a new experience for me. I also learned a lot about lighting design through this project, and it introduced to me a whole new field of design.</p>
